[project]
name = "procurement-agent"
version = "0.1.0"
description = "Agentic human-in-the-loop RAG pipeline for solar-plus-storage component procurement"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "UNLICENSED" }

# Core stays deliberately thin. Every heavy dependency sits behind an extra so
# that NFR-04 (parsers, OCR, embedders, vector store, reranker, LLM must be
# swappable) is enforced by packaging, not just by convention.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Document parsing / OCR. Apache-2.0 and MIT only - the reference memo flags
# Surya (GPL-3.0), MinerU (AGPL-3.0) and olmOCR (Rail-M revenue cap) as
# unusable in a commercial product. Confirm licences again at integration time.
parse = [
    "docling>=2.0",
    "pandas>=2.2",
]
# Orchestration + schema-constrained extraction.
agent = [
    "langgraph>=0.2",
    "instructor>=1.5",
]
# Free spec validation against the CEC equipment lists (FR-WEB-05 authority tier).
solar = [
    "pvlib>=0.11",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["procurement_agent"]
mypy_path = "src"
strict = true
