[project]
name = "procurement-agent"
version = "0.1.0"
description = "Agentic human-in-the-loop RAG pipeline for solar-plus-storage component procurement"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "UNLICENSED" }

# Core stays deliberately thin. Every heavy dependency sits behind an extra so
# that NFR-04 (parsers, OCR, embedders, vector store, reranker, LLM must be
# swappable) is enforced by packaging, not just by convention.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Pinned EXACTLY, not >=. docProps/app.xml literally embeds the string
    # "Openpyxl 3.1.5", so a patch bump changes the output bytes and breaks
    # every historical AC-7 hash with zero data change. See plan.md Decision 8c.
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# Document parsing / OCR. Apache-2.0 and MIT only. Research verified licences at
# primary sources and rejected: Marker (weights revenue-capped), Surya (GPL-3.0),
# MinerU (AGPL-3.0), olmOCR (Rail-M revenue cap). See plan.md licence gate.
parse = [
    "docling>=2.115",
    "pandas>=2.2",
    "pymupdf>=1.24",   # per-page text-layer detection for the parser router
]
# Schema-constrained extraction against a self-hosted vLLM endpoint.
# NOTE: use json_schema mode, NOT Instructor's default TOOLS mode - tool calls
# do not emit logprobs, which discards the confidence signal. plan.md Decision 7.
extract = [
    "instructor>=1.15",
    "openai>=1.50",
]
# CEC equipment-list cross-check (FR-WEB-05 authority tier).
# WARNING: pvlib's BUNDLED CEC library is frozen at March 2019 and contains ZERO
# modules >=600 W, while this project's modules are 600-740 W. Never call
# retrieve_sam() with defaults - pass path= pointing at a pinned copy of the live
# SAM CSV. See clarifications.md D-8a.
solar = [
    "pvlib>=0.11",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["procurement_agent"]
mypy_path = "src"
strict = true
